services:
  db:
    image: postgres:16-alpine
    container_name: challenge-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: challenge_tracker
    ports:
      - "5544:5432"
    volumes:
      - challenge-tracker-db-data:/var/lib/postgresql/data

volumes:
  challenge-tracker-db-data:
