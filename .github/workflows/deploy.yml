name: Deploy

# Section 62 — Deployment Strategy:
#   PR            -> preview deployment (Vercel builds previews automatically
#                    once the Vercel GitHub integration is connected to this
#                    repo; this workflow does not duplicate that).
#   merge to main -> run migrations against production, then deploy.
#
# Set the PRODUCTION_ENABLED repository variable to true after configuring
# these production secrets (see docs/crawler-operations.md "Deployment"):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, DATABASE_URL (production)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  production-ready:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        name: Check whether production is enabled
        env:
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_ENABLED }}
        run: |
          if [[ "$PRODUCTION_ENABLED" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Production deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Set the PRODUCTION_ENABLED repository variable to true after configuring the production secrets listed in docs/crawler-operations.md." >> "$GITHUB_STEP_SUMMARY"
          fi

  migrate:
    needs: production-ready
    if: needs.production-ready.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check production secrets before migration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          for key in DATABASE_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!key}" ]]; then
              missing+=("$key")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing production secrets: %s\n' "${missing[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Section 41 — snapshot before a production migration. Managed
      # Postgres (Supabase/RDS/etc.) backup APIs vary; wire the provider's
      # CLI/API call here before enabling this workflow for real.
      - name: Reminder to confirm a fresh backup exists
        run: echo "Confirm a database backup/snapshot was taken before this migration runs (Section 41)."
      - name: Run database migrations (Section 42 — migrations only, never ad-hoc schema changes)
        run: npm run db:migrate

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
